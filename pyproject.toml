[project]
name = "q2galaxy"
authors = [
    { name = "QIIME 2 development team", email = "developers@qiime2.org" }
]
description = "Generate and run Galaxy tool wrappers for QIIME 2"
readme = {file = "README.md", content-type = "text/markdown"}
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click",
    "lxml",
    "pyyaml",
    "rachis>=2026.7.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/qiime2/q2galaxy"
Repository = "https://github.com/qiime2/q2galaxy"

[project.scripts]
"q2galaxy" = "q2galaxy.__main__:root"

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2galaxy/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2galaxy*"]

[tool.setuptools.package-data]
q2galaxy = ["**/*"]
